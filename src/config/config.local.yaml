# 应用服务配置
server:
  port: 6275

# 日志
logger:
  level: "info" # 日志记录的等级 silent<info<warn<error

# security 安全
security:
  csrf:
    refererWhiteList:
      - "127.0.0.1:6275"
      - "localhost:6265"
      - "127.0.0.1:6265"
      - "192.168.56.100"

# GORM 数据源
database:
  dataSource:
    default:
      type: "mysql"
      host: "<mysql地址>"
      port: 3306
      username: "<用户名>"
      password: "<密码>"
      database: "<数据库>"
      logging: true

# Redis 缓存数据
cache:
  dataSource:
    default:
      port: 6379 # Redis port
      host: "<redis地址>"
      password: "<密码>"
      db: 0 # Redis db_num
