# 应用服务配置
server:
  host: "0.0.0.0" # 服务地址, 默认绑定所有地址
  port: 6275 # 服务端口
  key: "" # 服务端私钥
  cert: "" # 服务端证书
  proxy: false # 是否开启代理

# 日志
logger:
  fileDir: "/var/log"
  fileName: "mask_api_gin.log"
  level: "warn" # 日志记录的等级 silent<info<warn<error
  maxDay: 30 # 日志会保留 30 天
  maxSize: 10 # 调整按 10MB 大小的切割

# 静态文件配置, 相对项目根路径或填绝对路径
staticFile:
  # 默认资源，dir目录需要预先创建
  default:
    prefix: "/static"
    dir: "../mask_file/static"
  # 文件上传资源目录映射，与项目目录同级
  upload:
    prefix: "/upload"
    dir: "../mask_file/upload"

# 文件上传
upload:
  # 最大上传文件大小，默认为 10mb
  fileSize: 10
  # 文件扩展名白名单
  whitelist:
    # 图片
    - ".bmp"
    - ".webp"
    - ".gif"
    - ".jpg"
    - ".jpeg"
    - ".png"
    # word excel powerpoint
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    # 文本文件
    - ".html"
    - ".htm"
    - ".txt"
    - ".csv"
    # pdf
    - ".pdf"
    # 压缩文件
    - ".zip"
    - ".gz"
    - ".tgz"
    - ".gzip"
    # 音视频格式
    - ".mp3"
    - ".mp4"
    - ".avi"
    - ".rmvb"

# cors 跨域
cors:
  # 设置 Access-Control-Allow-Origin 的值，【默认值】会获取请求头上的 origin
  # 例如：http://mask-api.org
  # 如果请求设置了 credentials，则 origin 不能设置为 *
  origin: "*"
  # 设置 Access-Control-Allow-Credentials，【默认值】false
  credentials: true
  # 设置 Access-Control-Max-Age
  maxAge: 31536000
  # 允许跨域的方法，【默认值】为 GET,HEAD,PUT,POST,DELETE,PATCH
  allowMethods:
    - "OPTIONS"
    - "HEAD"
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
  # 设置 Access-Control-Allow-Headers 的值，【默认值】会获取请求头上的 Access-Control-Request-Headers
  allowHeaders:
    - "X-App-Code"
    - "X-App-Version"
    - "Authorization"
    - "Origin"
    - "X-Requested-With"
    - "Content-Type"
    - "Content-Language"
    - "Accept"
    - "Range"
  # 设置 Access-Control-Expose-Headers 的值
  exposeHeaders:
    - "X-RepeatSubmit-Reset"

# security 安全
security:
  csrf:
    enable: true
    type: "referer"
    # 允许调用的域名地址的，例如：http://<Referer地址>/mask-api
    refererWhiteList:
      - "127.0.0.1:6275"
  xframe:
    enable: true
    value: "SAMEORIGIN"
  csp:
    enable: true
  hsts:
    enable: false
    maxAge: 31536000
    includeSubdomains: false
  noopen:
    enable: false
  nosniff:
    enable: false
  xssProtection:
    enable: true
    value: "1; mode=block"

# JWT 令牌配置
jwt:
  # 令牌算法 HS256 HS384 HS512
  algorithm: "HS512"
  # 令牌密钥
  secret: "abcdefghijklmnopqrstuvwxyz"
  # 访问令牌有效期（默认15分钟）
  expiresIn: 15
  # 刷新令牌有效期（默认7*24*60分钟）
  refreshIn: 10080

# GORM 数据源
database:
  dataSource:
    # 默认数据库实例
    default:
      type: "mysql"
      host: "127.0.0.1"
      port: 3306
      username: "<用户名>"
      password: "<密码>"
      database: "<数据库>"
      logging: false
  # 多个数据源时可以用这个指定默认的数据源
  defaultDataSourceName: "default"

# Redis 缓存数据
cache:
  dataSource:
    default:
      port: 6379 # Redis port
      host: "127.0.0.1" # Redis host
      password: "<密码>"
      db: 0 # Redis db_num
  # 多个数据源时可以用这个指定默认的数据源
  defaultDataSourceName: "default"

# 系统用户，将用户ID设定为系统管理员角色
systemUser:
  - 1
